<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowState Guardian</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      width: 320px;
      background: #0B0F19;
      color: #F8FAFC;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.3px;
    }
    .logo-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }
    .status-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-active {
      background: rgba(34, 197, 94, 0.15);
      color: #4ADE80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status-idle {
      background: rgba(148, 163, 184, 0.12);
      color: #94A3B8;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .task-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .task-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #818CF8;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .task-name {
      font-size: 13px;
      font-weight: 600;
      color: #FFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748B;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .sites-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
      max-height: 90px;
      overflow-y: auto;
    }
    .site-tag {
      font-size: 10px;
      background: rgba(239, 68, 68, 0.12);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-align: center;
      text-decoration: none;
      display: block;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      color: #FFF;
    }
    .btn-primary:hover {
      opacity: 0.95;
    }
    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      color: #CBD5E1;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #FFF;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">⚡</div>
      <span>FlowState Guardian</span>
    </div>
    <div class="status-pill status-idle" id="status-pill">
      <div class="dot"></div>
      <span id="status-text">Idle</span>
    </div>
  </div>

  <div class="task-card">
    <div class="task-label">Active Focus Goal</div>
    <div class="task-name" id="task-name">No active focus session</div>
  </div>

  <div class="section-title">🛡️ Active Blacklist (<span id="blacklist-count">0</span> sites)</div>
  <div class="sites-list" id="sites-list">
    <!-- Rendered dynamically -->
  </div>

  <button class="btn btn-primary" id="btn-open-app">🚀 Open FlowState App</button>
  <button class="btn btn-outline" id="btn-toggle-test">⚡ Toggle Test Guard Mode</button>

  <script src="popup.js"></script>
</body>
</html>
